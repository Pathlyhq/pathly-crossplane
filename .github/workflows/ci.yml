# Same checks as .gitlab-ci.yml (unit-test, build).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: go test ./internal/client/ -coverprofile=covclient.txt -covermode=atomic -count=1
      - run: go tool cover -func=covclient.txt
      - run: go test ./... -count=1
      - run: go build -o bin/provider ./cmd/provider
