apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: providerconfigs.pathly.pathlyhq.com
spec:
  group: pathly.pathlyhq.com
  names:
    categories:
      - crossplane
      - provider
      - pathly
    kind: ProviderConfig
    listKind: ProviderConfigList
    plural: providerconfigs
    singular: providerconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - credentialsSource
              properties:
                credentialsSource:
                  type: string
                  enum: [Secret, None, InjectedIdentity, Environment, Filesystem]
                  default: Secret
                credentialsSecretRef:
                  type: object
                  required: [name, namespace, key]
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    key:
                      type: string
                baseURL:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: SECRET-NAME
          type: string
          jsonPath: .spec.credentialsSecretRef.name
          priority: 1
