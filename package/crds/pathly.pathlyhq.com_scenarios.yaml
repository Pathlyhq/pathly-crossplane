apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scenarios.pathly.pathlyhq.com
spec:
  group: pathly.pathlyhq.com
  names:
    categories: [crossplane, managed, pathly]
    kind: Scenario
    listKind: ScenarioList
    plural: scenarios
    singular: scenario
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Scenario is a managed Pathly HTTP scenario (HTTP-only policy).
            Browser journeys are not accepted so credentials never land in etcd.
            Create PATHLY_API_TOKEN at https://pathlyhq.com and reference it from ProviderConfig.
            Docs: https://pathlyhq.com/en/developers
          type: object
          properties:
            spec:
              type: object
              required: [forProvider]
              properties:
                deletionPolicy:
                  type: string
                managementPolicies:
                  type: array
                  items:
                    type: string
                providerConfigRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required: [name]
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                forProvider:
                  type: object
                  required: [name, type]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    type:
                      description: >-
                        Scenario type. Only "http" is accepted (HTTP-only policy).
                        Browser step ASTs are rejected. See https://pathlyhq.com/en/developers
                      type: string
                      enum: [http]
                      default: http
                    url:
                      type: string
                    intervalSec:
                      type: integer
                      format: int64
                    method:
                      type: string
                    expectedStatus:
                      type: integer
                      format: int64
                    maxLatencyMs:
                      type: integer
                      format: int64
                    expectText:
                      type: string
                    regions:
                      type: array
                      items:
                        type: string
                    tags:
                      type: array
                      items:
                        type: string
                    folder:
                      type: string
                    severity:
                      type: string
                    runbook:
                      type: string
                    cron:
                      type: string
                    enabled:
                      type: boolean
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: SYNCED
          type: string
          jsonPath: .status.conditions[?(@.type=='Synced')].status
        - name: EXTERNAL-NAME
          type: string
          jsonPath: .metadata.annotations['crossplane.io/external-name']
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
